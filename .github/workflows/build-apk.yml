name: Build & Release SoundPod APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Build Signed Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease assembleFdroidRelease

      - name: Collect and Rename APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/github/release/*.apk release-apks/SoundPod-github-release.apk
          cp app/build/outputs/apk/fdroid/release/*.apk release-apks/SoundPod-fdroid-release.apk

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundPod-Signed-APKs
          path: release-apks/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true

      - name: Clean up Keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
