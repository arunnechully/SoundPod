name: Build & Release SoundPod APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases after building?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Build Signed Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease assembleFdroidRelease

      - name: Collect and Rename APKs
        id: get_version
        run: |
          VERSION=$(grep -m 1 'versionName[[:space:]]*=' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mkdir -p release-apks
          cp app/build/outputs/apk/github/release/*.apk "release-apks/SoundPod-v${VERSION}-github-release.apk"
          cp app/build/outputs/apk/fdroid/release/*.apk "release-apks/SoundPod-v${VERSION}-fdroid-release.apk"

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundPod-v${{ steps.get_version.outputs.version }}-Signed-APKs
          path: release-apks/*.apk

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: SoundPod v${{ steps.get_version.outputs.version }}
          files: release-apks/*.apk
          generate_release_notes: true

      - name: Clean up Keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
